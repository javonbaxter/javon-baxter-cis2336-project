<main>


<section class="form-section">


<h2>
Artist Submission Form
</h2>


<p>
Artists can submit their artwork information below.
</p>




<form id="artist-form">


<label>
Artist Name:
</label>

<input type="text" id="artistName" required>




<label>
Email Address:
</label>

<input type="email" id="email" required>




<label>
Artwork Title:
</label>

<input type="text" id="artTitle" required>




<label>
Category:
</label>


<select id="category" required>

<option value="">
Select Category
</option>

<option>
Painting
</option>

<option>
Digital Art
</option>

<option>
Photography
</option>

<option>
Sculpture
</option>

</select>




<label>
Price:
</label>

<input type="number" id="price" required>




<label>
Artwork Description:
</label>


<textarea id="description" required></textarea>




<button type="submit">
Submit Artwork
</button>


<p id="form-message"></p>


</form>



</section>


</main>
