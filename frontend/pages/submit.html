<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArtConnect | Submit Artwork</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <header>

        <nav class="navbar">

            <h1 class="logo">
                ArtConnect
            </h1>

            <ul class="nav-links">

                <li>
                    <a href="../index.html">Home</a>
                </li>

                <li>
                    <a href="gallery.html">Gallery</a>
                </li>

                <li>
                    <a href="events.html">Events</a>
                </li>

                <li>
                    <a href="submit.html">Submit Artwork</a>
                </li>

                <li>
                    <a href="faq.html">FAQ</a>
                </li>

                <li>
                    <a href="references.html">References</a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <section class="form-section">

            <h2>
                Artist Submission Form
            </h2>

            <p>
                Artists can submit their artwork information below.
            </p>


            <form id="artist-form">

                <label for="artist-name">
                    Artist Name:
                </label>

                <input
                    type="text"
                    id="artist-name"
                    required
                >


                <label for="email">
                    Email Address:
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label for="art-title">
                    Artwork Title:
                </label>

                <input
                    type="text"
                    id="art-title"
                    required
                >


                <label for="category">
                    Category:
                </label>

                <select id="category" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Painting">
                        Painting
                    </option>

                    <option value="Digital Art">
                        Digital Art
                    </option>

                    <option value="Photography">
                        Photography
                    </option>

                    <option value="Sculpture">
                        Sculpture
                    </option>

                </select>


                <label for="price">
                    Price:
                </label>

                <input
                    type="number"
                    id="price"
                    min="0"
                    step="0.01"
                    required
                >


                <label for="description">
                    Artwork Description:
                </label>

                <textarea
                    id="description"
                    required
                ></textarea>


                <button type="submit">
                    Submit Artwork
                </button>


                <p id="form-message"></p>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 ArtConnect
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
